name: Bug report
description: Something doesn't work the way the documentation says it should.
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what went wrong. Paste error messages as text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest command, configuration or input that shows the problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you run (e.g. the output of `<tool> version`), or a commit.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and architecture, and anything else that matters, such as the Kubernetes or Go version.
      placeholder: macOS 26 on arm64
  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Relevant log output, run with debug logging if the tool has it.
      render: text
