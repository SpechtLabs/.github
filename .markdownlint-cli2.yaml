config:
  # Default state for all rules
  default: true

  # MD013: Disable line length rule
  MD013: false

  # MD041: The pull request template is a single HTML comment the author
  # deletes, so it has no heading to start with.
  MD041: false

  # MD040: Every fenced code block needs a language tag.
  MD040: true

globs:
  - "**/*.md"

ignores:
  - "**/node_modules/**"
